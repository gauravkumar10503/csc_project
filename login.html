<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login Form</title>
</head>
<body>
    <form class="form">
                    <h1 align="center">Login Form</h1>
                    <input type="text" placeholder="Enter Your Name" required> <br>
                    <input type="number" placeholder="Enter Your Number" minlength="6000000000" maxlength="9999999999"
                        required> <br>
                    <input type="email" placeholder="Enter Your Mail" required> <br>
                    <input type="password" placeholder="Enter Your Password" required> <br>
                    <button type="submit" id="box-button" onclick="alert(`Your are logged in`)"><a href="index.html">Log in</a></button>
                </form>
</body>
</html>
